<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08264b"><meta name="version" content="20260803-meeting-mastery">
<title>Meeting English Mastery</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#08264b;--blue:#1469d8;--teal:#08a6a6;--ink:#13233a;--muted:#64748b;--line:#dbe5f0;--paper:#f5f8fc;--card:#fff;--gold:#ec9c18}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.hero{background:linear-gradient(135deg,#061e3e,#0c3970);color:white;padding:26px 18px 30px}.wrap{max-width:880px;margin:auto}.eyebrow{color:#57e0d4;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.hero h1{font-size:29px;line-height:1.2;margin:7px 0}.hero p{margin:4px 0;color:#d5e7fa}.source{font-size:12px;color:#a8c9eb;margin-top:10px}.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:13px 16px;white-space:nowrap;font-weight:700;font-size:13px}.nav button.active{color:var(--blue);box-shadow:inset 0 -3px var(--blue)}main{padding:18px}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 7px #0b31510a}.today-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:13px 8px;text-align:center}.metric b{display:block;font-size:19px;color:var(--blue)}.metric span{font-size:12px;color:var(--muted)}.progress{height:9px;border-radius:9px;background:#e5edf5;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0;transition:.25s}.btn,.icon{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8f1ff;color:#0752af}.btn.ghost{background:#fff;color:var(--blue);border:1px solid #bed5f5}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{font-size:19px;margin:2px 0 11px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:7px 11px;white-space:nowrap;font-size:12px;font-weight:700}.filter.active{background:#e7f1ff;color:var(--blue);border-color:#9bc4fa}.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}.item-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.word{font-size:20px;font-weight:800;line-height:1.25}.ipa,.meta{color:var(--muted);font-size:12px}.badge{font-size:11px;background:#fff4d8;color:#a76600;border-radius:99px;padding:3px 7px;white-space:nowrap}.details{display:none;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}.show .details{display:block}.details p{margin:4px 0}.card-actions{display:flex;align-items:center;gap:8px;margin-top:12px}.icon{padding:7px 9px;background:#edf5ff;color:#0961bc}.icon.on{background:#d4f5ef;color:#087a76}.grow{flex:1}.phrase-en,.para-en{font-weight:650;line-height:1.65}.phrase-cn,.para-cn{color:#41536d;margin-top:7px}.scene{font-size:12px;color:var(--teal);font-weight:700;margin-bottom:7px}.mode{display:flex;gap:6px;margin-bottom:11px}.mode button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;color:var(--muted);font-weight:700;font-size:12px}.mode button.active{color:var(--blue);background:#eaf3ff}.empty{text-align:center;color:var(--muted);padding:28px}.study{position:fixed;inset:0;background:#f5f8fc;z-index:10;padding:20px;overflow:auto;display:none}.study.open{display:block}.study .card{max-width:650px;margin:30px auto}.study-top{max-width:650px;margin:auto;display:flex;justify-content:space-between}.study-title{color:var(--muted);font-size:13px}.study-word{font-size:28px;font-weight:800;margin-top:20px}.footer{text-align:center;color:#8091a7;font-size:12px;padding:20px}@media(min-width:650px){.hero{padding:42px}.hero h1{font-size:36px}main{padding:26px}.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list .card{margin:0}.para-list{display:block}.today-grid{max-width:500px}}
</style></head><body>
<header class="hero"><div class="wrap"><div class="eyebrow">Meeting English</div><h1>Meeting English Mastery</h1><p>200 Words · 50 Phrases · 20 Paragraphs</p><div class="source">Based on real DBR &amp; management meetings</div></div></header>
<nav class="nav"><button class="active" data-tab="today">今日 Today</button><button data-tab="vocab">词汇 Vocabulary</button><button data-tab="phrases">短句 Phrases</button><button data-tab="practice">段落 Practice</button></nav>
<main class="wrap"><section id="today" class="panel active"></section><section id="vocab" class="panel"></section><section id="phrases" class="panel"></section><section id="practice" class="panel"></section></main><div id="study" class="study"></div><footer class="footer">Meeting English Mastery · Progress is stored on this device</footer>
<script>
const state={tab:'today',vcat:'All',pscene:'All',search:'',star:false,favorites:false,mode:'both'};let D;
const key=(n)=>'meetingEnglish:'+n;const get=n=>new Set(JSON.parse(localStorage.getItem(key(n))||'[]'));const set=(n,v)=>localStorage.setItem(key(n),JSON.stringify([...v]));
function mastered(type,id){return get('mastered:'+type).has(id)} function fav(type,id){return get('fav:'+type).has(id)}
function toggle(n,id){let s=get(n);s.has(id)?s.delete(id):s.add(id);set(n,s);render()}
let _spkVoice=null;(function(){if(!window.speechSynthesis)return;let load=()=>{let v=speechSynthesis.getVoices();_spkVoice=v.find(x=>x.lang==='en-US'&&x.localService)||v.find(x=>x.lang.startsWith('en'))||v[0]||null};load();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=load})();
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();setTimeout(()=>{let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;if(_spkVoice)u.voice=_spkVoice;speechSynthesis.speak(u)},60)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buttons(type,x,text){return `<div class="card-actions"><button class="icon" onclick="event.stopPropagation();speak(${JSON.stringify(text)})" aria-label="播放">🔊</button><span class="grow"></span><button class="icon ${fav(type,x.id)?'on':''}" onclick="event.stopPropagation();toggle('fav:${type}',${x.id})">${fav(type,x.id)?'★':'☆'}</button><button class="icon ${mastered(type,x.id)?'on':''}" onclick="event.stopPropagation();toggle('mastered:${type}',${x.id})">${mastered(type,x.id)?'✓ 已掌握':'✓ 掌握'}</button></div>`}
function vocabCard(x){return `<article class="card vocab" onclick="this.classList.toggle('show')"><div class="item-head"><div><div class="word">${x.star?'⭐ ':''}${esc(x.word)}</div><div class="ipa">${esc(x.ipa)}</div></div><span class="badge">${esc(x.category)}</span></div><div class="details"><p><b>中文：</b>${esc(x.cn)}</p><p><b>近义/同类：</b>${esc(x.similar)}</p><p><b>中文谐音：</b>${esc(x.phonetic)}</p></div>${buttons('v',x,x.word)}</article>`}
function phraseCard(x){return `<article class="card"><div class="scene">${esc(x.scene)}</div><div class="phrase-en">${esc(x.en)}</div><div class="phrase-cn">${esc(x.cn)}</div>${buttons('p',x,x.en)}</article>`}
function paraCard(x){let en=state.mode!=='cn',cn=state.mode!=='en';return `<article class="card"><div class="scene">${esc(x.scene)}</div><div class="word" style="font-size:16px">${x.id}. ${esc(x.title)}</div>${en?`<div class="para-en">${esc(x.en)}</div>`:''}${cn?`<div class="para-cn">${esc(x.cn)}</div>`:''}${buttons('r',x,x.en)}</article>`}
function filterItems(arr,type){let q=state.search.toLowerCase();return arr.filter(x=>(!state.favorites||fav(type,x.id))&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}
function today(){let stars=D.vocabulary.filter(x=>x.star), words=[...stars,...D.vocabulary.filter(x=>!x.star)].slice(0,10),phr=D.phrases.slice(0,5),par=D.paragraphs[0];let wm=words.filter(x=>mastered('v',x.id)).length,pm=phr.filter(x=>mastered('p',x.id)).length,rm=mastered('r',par.id)?1:0;let pct=Math.round((wm+pm+rm)/16*100);return `<div class="card"><div class="section-title">Today / 今日必学</div><div class="today-grid"><div class="card metric"><b>${wm}/10</b><span>词汇</span></div><div class="card metric"><b>${pm}/5</b><span>短句</span></div><div class="card metric"><b>${rm}/1</b><span>段落</span></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="meta">今日完成度 ${pct}% · 优先精选高频词</div><div class="actions" style="margin-top:13px"><button class="btn" onclick="startStudy()">开始今日学习</button><button class="btn secondary" onclick="state.favorites=!state.favorites;render()">${state.favorites?'显示全部':'只看收藏'}</button><button class="btn ghost" onclick="resetProgress()">重置进度</button></div></div><h2 class="section-title">今日内容</h2><div class="list">${words.slice(0,3).map(vocabCard).join('')}</div><div class="card"><div class="scene">今日短句</div>${phr.slice(0,2).map(phraseCard).join('')}</div>`}
function vocabulary(){let cats=['All',...new Set(D.vocabulary.map(x=>x.category))], arr=filterItems(D.vocabulary.filter(x=>(state.vcat==='All'||x.category===state.vcat)&&(!state.star||x.star)),'v');return `<h2 class="section-title">Vocabulary <span class="meta">${arr.length}/200</span></h2><input class="search" placeholder="搜索英文、中文、近义词…" oninput="state.search=this.value;render()" value="${esc(state.search)}"><div class="filters">${cats.map(c=>`<button class="filter ${state.vcat===c?'active':''}" onclick="state.vcat=${JSON.stringify(c)};render()">${esc(c)}</button>`).join('')}</div><div class="actions"><button class="filter ${state.star?'active':''}" onclick="state.star=!state.star;render()">⭐ 必学</button><button class="filter ${state.favorites?'active':''}" onclick="state.favorites=!state.favorites;render()">★ 收藏</button></div><p class="meta">单词卡默认仅显示英文与 IPA；点击卡片显示答案。</p><div class="list">${arr.map(vocabCard).join('')||'<div class="empty">没有匹配的词汇</div>'}</div>`}
function phrases(){let scenes=['All',...new Set(D.phrases.map(x=>x.scene))],arr=filterItems(D.phrases.filter(x=>state.pscene==='All'||x.scene===state.pscene),'p');return `<h2 class="section-title">Phrases <span class="meta">${arr.length}/50</span></h2><input class="search" placeholder="搜索短句、翻译或场景…" oninput="state.search=this.value;render()" value="${esc(state.search)}"><div class="filters">${scenes.map(c=>`<button class="filter ${state.pscene===c?'active':''}" onclick="state.pscene=${JSON.stringify(c)};render()">${esc(c)}</button>`).join('')}</div><button class="filter ${state.favorites?'active':''}" onclick="state.favorites=!state.favorites;render()">★ 只看收藏</button><div class="para-list">${arr.map(phraseCard).join('')||'<div class="empty">没有匹配的短句</div>'}</div>`}
function practice(){let arr=filterItems(D.paragraphs,'r');return `<h2 class="section-title">Practice <span class="meta">${arr.length}/20</span></h2><div class="mode">${[['en','English'],['cn','中文'],['both','双语']].map(x=>`<button class="${state.mode===x[0]?'active':''}" onclick="state.mode='${x[0]}';render()">${x[1]}</button>`).join('')}<button class="filter ${state.favorites?'active':''}" onclick="state.favorites=!state.favorites;render()">★ 收藏</button></div><div class="para-list">${arr.map(paraCard).join('')||'<div class="empty">没有收藏的段落</div>'}</div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===state.tab));document.querySelector('#today').innerHTML=today();document.querySelector('#vocab').innerHTML=vocabulary();document.querySelector('#phrases').innerHTML=phrases();document.querySelector('#practice').innerHTML=practice()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.search='';render();scrollTo(0,0)});
function startStudy(){let items=[...D.vocabulary.filter(x=>x.star).slice(0,10).map(x=>['v',x]),...D.phrases.slice(0,5).map(x=>['p',x]),['r',D.paragraphs[0]]],i=0,box=document.querySelector('#study');function next(){let [t,x]=items[i];let title=t==='v'?'词汇':t==='p'?'短句':'段落';let en=x.word||x.en;box.innerHTML=`<div class="study-top"><button class="btn ghost" onclick="document.querySelector('#study').classList.remove('open')">关闭</button><span class="study-title">${i+1}/${items.length} · ${title}</span></div><div class="card"><div class="scene">连续学习</div><div class="study-word">${esc(en)}</div>${x.ipa?`<div class="ipa">${esc(x.ipa)}</div>`:''}<div class="details" style="display:block"><p>${esc(x.cn||'')}</p>${x.similar?`<p class="meta">${esc(x.similar)} · ${esc(x.phonetic)}</p>`:''}</div>${buttons(t,x,en)}<div class="actions"><button class="btn" onclick="speak(${JSON.stringify(en)})">🔊 播放</button><button class="btn secondary" onclick="if(${i}<${items.length-1}){window._next()}else{document.querySelector('#study').classList.remove('open');render()}">${i===items.length-1?'完成今日学习':'下一项'}</button></div></div>`}window._next=()=>{i++;next()};box.classList.add('open');next()}
function resetProgress(){if(confirm('清除本设备上的掌握进度？')){['mastered:v','mastered:p','mastered:r'].forEach(x=>localStorage.removeItem(key(x)));render()}}
fetch('data.json?v=20260803').then(r=>r.json()).then(x=>{D=x;render()}).catch(()=>document.querySelector('#today').innerHTML='<div class="empty">学习数据加载失败，请刷新重试。</div>');
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
</script></body></html>
